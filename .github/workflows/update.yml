name: Update event data & rebuild site

on:
  schedule:
    - cron: "0 */6 * * *"   # every 6 hours
  workflow_dispatch: {}       # lets you trigger it manually from the Actions tab
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch latest events
        env:
          BANDSINTOWN_APP_ID: ${{ secrets.BANDSINTOWN_APP_ID }}
          TICKETMASTER_API_KEY: ${{ secrets.TICKETMASTER_API_KEY }}
        run: node scripts/fetch-events.mjs

      - name: Rebuild static site
        run: node scripts/build-site.mjs

      - name: Commit changes
        run: |
          git config user.name "marquee-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/events.json docs/
          git diff --quiet --cached || git commit -m "Auto-update events $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
